name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Supports both an extracted project and a ZIP uploaded to the repository.
      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          is_android_project() {
            [[ -f "$1/settings.gradle.kts" && -f "$1/app/build.gradle.kts" ]]
          }

          PROJECT_DIR=""

          if is_android_project "."; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif is_android_project "intelligent_dj"; then
            PROJECT_DIR="$GITHUB_WORKSPACE/intelligent_dj"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' -print -quit || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No se encontró el proyecto ni un archivo ZIP en la raíz del repositorio."
              echo "Subí el ZIP del proyecto o extraé su contenido conservando la carpeta intelligent_dj/."
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print
              exit 1
            fi

            echo "Archivo ZIP encontrado: $ZIP_FILE"
            EXTRACT_DIR="$RUNNER_TEMP/intelligent-dj-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name 'settings.gradle.kts' -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: El ZIP no contiene settings.gradle.kts."
              find "$EXTRACT_DIR" -maxdepth 5 -type f -print
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: Se encontró settings.gradle.kts, pero falta app/build.gradle.kts en $PROJECT_DIR."
            exit 1
          fi

          echo "Proyecto Android: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Estructura Android verificada."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-dj-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
