
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build INTELLIGENT DJ
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle and Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          gradle --version

          echo "Android project verified."
          echo "Gradle Wrapper is not required."

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-dj-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
