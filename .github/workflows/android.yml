name: Compilar IMPERIO DJ PRO MIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias e instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Localizar proyecto Android
        shell: bash
        run: |
          set -e
          SETTINGS_FILE="$(find . -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -not -path './.git/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname 'IMPERIO_DJ_PRO_MIX_GITHUB.zip' -print -quit)"
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p extracted-project
              unzip -q "$ZIP_FILE" -d extracted-project
              SETTINGS_FILE="$(find extracted-project -type f \\( -name settings.gradle -o -name settings.gradle.kts \\) -print -quit)"
            fi
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No se encontró settings.gradle ni settings.gradle.kts. Sube y descomprime los archivos fuente del proyecto Android en el repositorio."
            echo "Contenido de la raíz del repositorio:"
            ls -la
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto Android encontrado en: $PROJECT_DIR"

      - name: Compilar APK Debug
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-DJ-PRO-MIX-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
