
name: Compilar IMPERIO DJ PRO MIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          unzip -o IMPERIO_DJ_PRO_MIX_GITHUB.zip -d proyecto

          echo "Buscando archivos Gradle..."
          find proyecto -name settings.gradle.kts -o -name settings.gradle

          PROJECT_DIR=$(dirname "$(find proyecto -name settings.gradle.kts -o -name settings.gradle | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "proyecto" ]; then
            echo "ERROR: No se encontró el proyecto Android"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Aceptar licencias
        run: |
          yes | sdkmanager --licenses || true

      - name: Instalar Android SDK 35
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      - name: Verificar proyecto
        run: |
          cd "$PROJECT_DIR"
          ls -la
          test -f settings.gradle.kts || test -f settings.gradle

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-DJ-PRO-MIX-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
