name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build INTELLIGENT DJ
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # First check whether the Android project is already in the repository.
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/.git/*' \
              -not -path '*/build/*' \
              -print
          )

          # If the repository contains the source ZIP, extract it and locate the project.
          if [[ -z "$PROJECT_DIR" ]]; then
            EXTRACT_DIR="$RUNNER_TEMP/intelligent-dj-extracted"
            mkdir -p "$EXTRACT_DIR"

            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' \
              -not -path '*/.git/*' -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::No Android project or source ZIP was found in the repository."
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -not -path '*/.git/*' | sort | head -200
              exit 1
            fi

            echo "Extracting source archive: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            while IFS= read -r file; do
              candidate="$(dirname "$file")"
              if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(
              find "$EXTRACT_DIR" \
                -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
                -not -path '*/build/*' \
                -print
            )
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::The ZIP was extracted, but no Android Gradle project with an app module was found."
            find "$RUNNER_TEMP/intelligent-dj-extracted" -maxdepth 6 -type f | sort | head -250
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu-latest runner already provides Android command-line tools.
      # Do not use android-actions/setup-android here: it attempts to install the
      # obsolete SDK package named "tools", which causes sdkmanager to fail.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::Android SDK was not found on the GitHub runner."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager \
            -print 2>/dev/null | sort -V | tail -n 1)"

          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # Accept licenses. sdkmanager may close the pipe after reading them.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::Android SDK license acceptance failed."
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle

          gradle --version
          echo "Android project files verified. Gradle Wrapper is not required."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not generated at $APK"
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: INTELLIGENT-DJ-APK-v0.1.0
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
