name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build INTELLIGENT DJ
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # First, look for an Android Gradle project already checked out.
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$GITHUB_WORKSPACE" \
            -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.git/*' -print)

          # If the repository contains the source ZIP instead, extract it.
          if [ -z "$PROJECT_DIR" ]; then
            mkdir -p "$RUNNER_TEMP/intelligent-dj-extracted"
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting: $ZIP_FILE"
              unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/intelligent-dj-extracted"

              while IFS= read -r file; do
                candidate="$(dirname "$file")"
                if [ -f "$candidate/app/build.gradle.kts" ] || [ -f "$candidate/app/build.gradle" ]; then
                  PROJECT_DIR="$candidate"
                  break
                fi
              done < <(find "$RUNNER_TEMP/intelligent-dj-extracted" \
                -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found. The repository must contain settings.gradle(.kts), app/build.gradle(.kts), and gradlew, or a ZIP containing them."
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          # sdkmanager closes stdin after reading the licenses. Ignore only
          # the resulting 'yes' Broken pipe; preserve sdkmanager's exit code.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=$?
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed (exit $LICENSE_STATUS)"
            exit "$LICENSE_STATUS"
          fi

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f gradlew || {
            echo "::error::gradlew is missing. Include the Gradle wrapper in the project."
            exit 1
          }
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-dj-debug-apk
          path: |
            ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
