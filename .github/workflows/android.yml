name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          is_android_project() {
            [[ -f "$1/settings.gradle.kts" && -f "$1/app/build.gradle.kts" ]]
          }

          PROJECT_DIR=""
          if is_android_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif is_android_project "$GITHUB_WORKSPACE/intelligent_dj"; then
            PROJECT_DIR="$GITHUB_WORKSPACE/intelligent_dj"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' -print -quit || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No se encontró el proyecto Android ni un ZIP en el repositorio."
              find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -print
              exit 1
            fi

            EXTRACT_DIR="$RUNNER_TEMP/intelligent-dj-source"
            mkdir -p "$EXTRACT_DIR"
            unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"
            SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name 'settings.gradle.kts' -print -quit || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: El ZIP no contiene settings.gradle.kts."
              find "$EXTRACT_DIR" -maxdepth 5 -type f -print
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ERROR: Falta app/build.gradle.kts en $PROJECT_DIR"
            exit 1
          fi

          echo "Proyecto Android encontrado en: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already provide Android command-line tools.
      # Do not use setup-android@v3 here: it attempts to install the obsolete
      # SDK package named "tools", which now fails with "Failed to find package".
      - name: Configure Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "ERROR: No se encontró sdkmanager dentro de $ANDROID_HOME/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "Usando sdkmanager: $SDKMANAGER"

      - name: Accept licenses and install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          echo "Estructura Android verificada."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: intelligent-dj-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
