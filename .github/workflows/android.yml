name: Compilar IMPERIO DJ PRO MIX

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Generar APK Android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No usar android-actions/setup-android aquí: su configuración
      # predeterminada intenta instalar el paquete obsoleto "tools".
      - name: Aceptar licencias e instalar Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar herramientas
        run: |
          java -version
          gradle --version
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -print

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-DJ-PRO-MIX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
