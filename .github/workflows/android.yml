
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build INTELLIGENT DJ APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="INTELLIGENT_DJ_by_Dj_Lucas_Quintana_v0.1.0_CI_FIXED.zip"
          EXTRACT_DIR="$RUNNER_TEMP/intelligent-dj"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Project ZIP not found: $ZIP_FILE"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR="$EXTRACT_DIR/intelligent_dj"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found after extraction"
            find "$EXTRACT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project successfully extracted:"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --version
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Build Android APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INTELLIGENT-DJ-APK-v0.1.0
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
